name: kdbx-cli-tests

networks:
  e2e: {}

volumes:
  seed: {}

services:
  postgres:
    image: postgres:17.6-alpine
    networks: [e2e]
    environment:
      POSTGRES_PASSWORD: ${E2E_PG_ADMIN_PW:?}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      E2E_PG_STDIN_PW: ${E2E_PG_STDIN_PW:?}
    volumes:
      - ./services/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 60

  sshd:
    build:
      context: services/sshd
    networks: [e2e]
    environment:
      E2E_SSH_PW: ${E2E_SSH_PW:?}
    volumes:
      - seed:/seed

  runner:
    profiles: [runner]
    build:
      context: .
      dockerfile: runner/Dockerfile
      args:
        KDBX_CLI_VERSION: ${KDBX_CLI_VERSION:?}
        KDBX_CLI_LOCAL: ${KDBX_CLI_LOCAL:-0}
      network: host
    networks: [e2e]
    env_file: .env
    environment:
      KDBX_CLI_VERSION: ${KDBX_CLI_VERSION:?}
    volumes:
      - seed:/seed
    depends_on:
      postgres:
        condition: service_healthy
      sshd:
        condition: service_healthy
