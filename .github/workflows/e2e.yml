name: E2E

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  e2e:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v3

      - name: Run the suite against the version in versions.txt
        run: just test
        env:
          DEMO: 1

      - name: Upload demo and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: _logs/
          if-no-files-found: ignore
